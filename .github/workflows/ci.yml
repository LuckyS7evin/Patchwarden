# Vérifications : formatage, analyse statique, tests (avec détection des accès
# concurrents), shellcheck sur le wrapper des nœuds et la sonde, compilation.
#
# Lancement manuel uniquement (onglet Actions → CI → Run workflow) : le dépôt est
# privé et le quota de minutes GitHub Actions est épuisé. Les mêmes vérifications
# se lancent en local avec `make ci` (voir docs/MISE-A-JOUR.md). Pour revenir au
# lancement automatique, ajouter sous « on: » :
#   push:
#     branches: [main]
#   pull_request:
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatage (gofmt)
        run: |
          fichiers="$(gofmt -l .)"
          if [ -n "$fichiers" ]; then
            echo "Fichiers non formatés (lancez gofmt -w) :"
            echo "$fichiers"
            exit 1
          fi

      - name: Analyse statique (go vet)
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 ./...

      - name: shellcheck (wrapper et sonde)
        run: shellcheck -S warning tools/sonde.sh deploy/patchwarden-wrapper

      - name: Compilation
        run: make build
