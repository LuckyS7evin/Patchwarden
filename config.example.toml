# PatchWarden : exemple de configuration.
# Copiez ce fichier en /etc/patchwarden/config.toml (droits 600, propriétaire patchwarden).
# Ne le versionnez jamais : il contient des secrets. Une clé inconnue est une erreur,
# ce qui évite les fautes de frappe silencieuses.

[server]
listen = "0.0.0.0:8080"
# Adresse de l'interface, pour les liens des notifications (facultatif).
# public_url = "http://192.168.0.19:8094"
# Mettre à true si l'interface est servie en HTTPS (directement ou via un reverse proxy).
cookie_secure = false

[auth]
username = "admin"
# Généré par : patchwarden hash-password
password_hash = "$2a$12$remplacez-moi"
session_duration = "12h"

# Un ou plusieurs points d'accès à l'API Proxmox.
# - En cluster : un seul suffit (il voit tous les nœuds). En ajouter un second
#   donne de la redondance si le premier nœud est éteint.
# - Nœuds autonomes : une section par nœud, chacune avec son propre jeton.
# Rien n'est codé en dur : changer d'IP (passage en VLAN) = modifier url ici.
[[proxmox]]
name = "loki"
url = "https://192.168.0.141:8006"
token_id = "patchwarden@pve!inventaire"
# Secret dans une variable d'environnement (recommandé, voir patchwarden.env),
# ou directement : token_secret = "xxxxxxxx-xxxx-…"
token_secret_env = "PATCHWARDEN_TOKEN_LOKI"
# Empreinte SHA-256 du certificat du nœud, sur le nœud :
#   openssl x509 -in /etc/pve/local/pve-ssl.pem -noout -fingerprint -sha256
fingerprint = "AA:BB:CC:…"
# Ou, à la place, l'autorité du cluster (le nom d'hôte de url doit figurer dans le certificat) :
# ca_file = "/etc/patchwarden/pve-root-ca.pem"

# [[proxmox]]
# name = "tyr"
# url = "https://192.168.0.43:8006"
# token_id = "patchwarden@pve!inventaire"
# token_secret_env = "PATCHWARDEN_TOKEN_TYR"
# fingerprint = "…"

[policy]
# Tag posé par community-scripts sur ses LXC.
community_script_tag = "community-script"
# Invités exigeant une confirmation renforcée : par tag Proxmox…
critical_tags = ["critique"]
# … ou par fragment de nom (insensible à la casse).
special_names = ["omv", "pbs", "proxmox-backup"]
# Invité qui héberge PatchWarden (« nœud/vmid ») : aucune mise à jour n'y est lancée
# depuis PatchWarden, elle le couperait en cours de route. Sans ce réglage, l'invité
# dont le nom égale le nom d'hôte de PatchWarden est considéré comme tel.
# self_guest = "loki/103"

[inventory]
refresh = "5m"
timeout = "15s"

# Accès aux nœuds par SSH, vers le wrapper à commande forcée (voir README).
# Sans section [ssh.nodes], PatchWarden reste en lecture seule.
[ssh]
user = "root"
key_file = "/etc/patchwarden/id_ed25519"        # créé par : patchwarden ssh-keygen
known_hosts = "/etc/patchwarden/known_hosts"    # clés d'hôte des nœuds, toujours vérifiées
connect_timeout = "10s"

# Nom du nœud Proxmox = adresse SSH (port 22 par défaut). Changer d'IP = modifier ici.
# À décommenter seulement à l'étape 6 du README, une fois la clé et known_hosts créés :
# tant que cette section est commentée, PatchWarden reste en lecture seule.
# [ssh.nodes]
# loki = "192.168.0.141"
# tyr = "192.168.0.43"
# odin = "192.168.0.49"

[jobs]
data_dir = "/var/lib/patchwarden"   # historique des tâches et dernières détections
max_parallel = 2                    # tâches simultanées (toujours une seule par invité)
retention = 500                     # nombre de tâches gardées dans l'historique

[detection]
# apt-get update avant la simulation : l'index apt des invités a souvent plusieurs
# semaines. Rafraîchit l'index sans rien installer.
apt_refresh = true
timeout = "15m"

[community_scripts]
# Seules sources de scripts acceptées (la source est lue dans l'invité).
allowed_bases = ["https://raw.githubusercontent.com/community-scripts/ProxmoxVE/main"]
website_url = "https://community-scripts.org"

[upstream]
# Jeton GitHub facultatif, sans aucun droit (« public repositories, read-only ») :
# sans lui, l'API GitHub limite à 60 requêtes par heure.
# github_token_env = "PATCHWARDEN_GITHUB_TOKEN"
cache_ttl = "6h"

# Détection automatique (lecture seule) de tous les LXC démarrés, heures locales.
# Rien n'est jamais mis à jour automatiquement.
# [schedule]
# detect_at = ["03:40"]

# Snapshots avant mise à jour (LXC ; stockage LVM-thin, ZFS, Ceph RBD ou Btrfs).
# [snapshots]
# default = false          # case cochée par défaut pour tous les invités ; sinon, seulement
#                          # pour les invités critiques et les changements de version majeure
# keep = 1                 # snapshots PatchWarden gardés par invité (les manuels ne sont jamais touchés)
# max_storage_pct = 90     # snapshot (donc mise à jour) refusé au-delà de ce remplissage

# Interface. Icônes des applis et des OS : selfh.st/icons (CC BY 4.0), téléchargées par
# PatchWarden (pas par le navigateur) puis gardées dans data_dir/icons. Sans accès
# Internet, ou avec icons = false : une pastille avec l'initiale.
# [ui]
# icons = true
# icon_base = "https://cdn.jsdelivr.net/gh/selfhst/icons/webp"

# Notifications : une section par cible. Types : ntfy, gotify, webhook.
# Événements : securite (nouveaux correctifs), applis (nouvelles versions),
# echec (mise à jour ou détection planifiée en échec), succes (mise à jour réussie).
# Défaut : securite, applis, echec. Test : patchwarden notify-test
# [[notify]]
# type = "ntfy"
# url = "https://ntfy.sh/mon-sujet-secret"
# token_env = "PATCHWARDEN_NTFY_TOKEN"
# events = ["securite", "applis", "echec"]
#
# [[notify]]
# type = "gotify"
# url = "https://gotify.lan"
# token_env = "PATCHWARDEN_GOTIFY_TOKEN"
