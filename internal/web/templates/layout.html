<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · PatchWarden</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/static/icone.svg" alt="" width="22" height="22"> PatchWarden</a>
  {{if .User}}
  <nav class="mainnav">
    <a href="/" {{if eq .Nav "inventaire"}}aria-current="page"{{end}}>Inventaire</a>
    <a href="/securite" {{if eq .Nav "securite"}}aria-current="page"{{end}}>Sécurité</a>
    <a href="/taches" {{if eq .Nav "taches"}}aria-current="page"{{end}}>Tâches</a>
  </nav>
  <div class="userbox">
    <span>{{.User}}</span>
    <form method="post" action="/deconnexion">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="btn btn-link">Se déconnecter</button>
    </form>
  </div>
  {{end}}
</header>
<main>
{{block "content" .}}{{end}}
</main>
<footer>PatchWarden {{.Version}} · aucune action n'est lancée sans confirmation</footer>
{{block "scripts" .}}{{end}}
</body>
</html>
